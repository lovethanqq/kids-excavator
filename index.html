<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>小小挖掘机挖数字 - 益智游戏</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- 本地离线库 (秒开、无网络依赖) -->
    <script src="lib/three.min.js"></script>
    <script src="lib/OrbitControls.js"></script>
    <script src="lib/gsap.min.js"></script>
    <script src="lib/qrcode.min.js"></script>
</head>
<body>
    <!-- 3D 游戏画布容器 -->
    <div id="game-container"></div>

    <!-- UI 控制交互层 -->
    <div id="ui-layer">
        <!-- 顶部信息栏 -->
        <div class="header-bar">
            <!-- 难度模式切换 -->
            <div class="mode-selector">
                <button class="mode-btn" data-mode="3" onclick="switchGameMode(3)">1 - 3 萌宝</button>
                <button class="mode-btn active" data-mode="5" onclick="switchGameMode(5)">1 - 5 进阶</button>
                <button class="mode-btn" data-mode="9" onclick="switchGameMode(9)">1 - 9 达人</button>
                <button class="qr-btn" onclick="showQrModal()">📱 平板扫码</button>
            </div>

            <!-- 目标指示牌 -->
            <div class="target-sign" id="target-sign" onclick="replayTargetAudio()">
                <span class="sign-label">请挖数字:</span>
                <div class="target-num-badge" id="target-number-display">?</div>
            </div>

            <!-- 星星进度条 -->
            <div class="stars-box" id="star-container">
                <!-- 动态填充 5 颗星 -->
            </div>
        </div>

        <!-- 底部中央小提示 -->
        <div class="hint-banner">👆 戳一戳泥堆上的数字，挖掘机会去挖它哦！</div>

        <!-- 底部控制栏 -->
        <div class="footer-bar">
            <!-- 左侧：声音与全屏 -->
            <div class="left-controls">
                <button class="icon-btn" id="mute-btn" title="声音开关" onclick="toggleMute()">🔊</button>
                <button class="icon-btn" id="fs-btn" title="全屏" onclick="toggleFullScreen()">⛶</button>
            </div>

            <!-- 右侧：超大鸣笛大黄钮 (小宝宝最爱按喇叭) -->
            <div class="right-controls">
                <button class="horn-btn" onclick="pressHorn()">
                    📢
                    <span>按喇叭</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 开始界面模态窗 (保证音频授权激活) -->
    <div class="modal-overlay" id="start-modal">
        <div class="modal-card">
            <div class="trophy-icon">🚜</div>
            <h1 class="modal-title">小小挖掘机出工啦！</h1>
            <p class="modal-desc">帮助黄色大挖掘机，挖出正确的数字泥块吧！零惩罚、超爽机械音效与破土动画！</p>
            <button class="big-btn" onclick="startGame()">
                <span>🚀 开动挖掘机！</span>
            </button>
        </div>
    </div>

    <!-- 胜利庆祝通关模态窗 -->
    <div class="modal-overlay hidden" id="victory-modal">
        <div class="modal-card">
            <div class="trophy-icon">🏆</div>
            <h1 class="modal-title">太棒啦！全通关！</h1>
            <p class="modal-desc">外甥真厉害，集满 5 颗大星星！挖掘机给你放烟花大庆祝啦！</p>
            <button class="big-btn" onclick="restartGame()">
                <span>🔄 再玩一次！</span>
            </button>
        </div>
    </div>

    <!-- 二维码扫码弹窗 -->
    <div class="modal-overlay hidden" id="qr-modal" onclick="hideQrModal(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="trophy-icon">📱</div>
            <h2 class="modal-title">平板扫码直接玩！</h2>
            <p class="modal-desc">确保平板和这台电脑连接同一个 WiFi，用平板微信或相机扫一扫：</p>
            <div class="qr-box">
                <div id="qrcode-container"></div>
                <div class="qr-url" id="qr-url-text">http://192.168.1.6:8080/excavator_kids/index.html</div>
            </div>
            <button class="big-btn" onclick="document.getElementById('qr-modal').classList.add('hidden')">
                <span>👌 知道了，关闭</span>
            </button>
        </div>
    </div>

    <!-- 逻辑脚本 -->
    <script src="js/audio.js"></script>
    <script src="js/excavator_model.js"></script>
    <script src="js/game.js"></script>

    <!-- 界面桥接与全屏控制 -->
    <script>
        let qrInstance = null;
        function showQrModal() {
            const modal = document.getElementById('qr-modal');
            modal.classList.remove('hidden');

            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            if (isLocal) {
                fetch('/api/ip')
                    .then(r => r.json())
                    .then(data => {
                        const url = `http://${data.ip}:${data.port}/excavator_kids/index.html`;
                        document.getElementById('qr-url-text').textContent = url;
                        renderQr(url);
                    })
                    .catch(() => {
                        const url = window.location.href;
                        document.getElementById('qr-url-text').textContent = url;
                        renderQr(url);
                    });
            } else {
                const url = window.location.href;
                document.getElementById('qr-url-text').textContent = url;
                renderQr(url);
            }
        }

        function renderQr(url) {
            const container = document.getElementById('qrcode-container');
            container.innerHTML = '';
            if (window.QRCode) {
                new QRCode(container, {
                    text: url,
                    width: 180,
                    height: 180,
                    colorDark: "#222222",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.M
                });
            }
        }

        function hideQrModal(e) {
            document.getElementById('qr-modal').classList.add('hidden');
        }

        function startGame() {
            window.soundManager.init();
            window.soundManager.startEngine();
            window.soundManager.playHorn();
            document.getElementById('start-modal').classList.add('hidden');
            if (window.game) {
                window.game.nextRound();
            }
        }

        function restartGame() {
            document.getElementById('victory-modal').classList.add('hidden');
            if (window.game) {
                window.game.stars = 0;
                window.game.updateStarUI();
                window.game.nextRound();
            }
        }

        function switchGameMode(mode) {
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.mode) === mode);
            });
            if (window.game) {
                window.game.setMode(mode);
            }
        }

        function replayTargetAudio() {
            if (window.game && window.game.targetNumber) {
                window.soundManager.speak(`小工友，请帮我挖出数字 ${window.game.targetNumber} 吧！`);
            }
        }

        function pressHorn() {
            window.soundManager.playHorn();
            // 挖掘机闪烁大灯
            if (window.game && window.game.excavator) {
                const ex = window.game.excavator;
                gsap.timeline()
                    .to(ex.cabGroup.position, { y: 1.25, duration: 0.1, yoyo: true, repeat: 1 })
                    .to(ex.boomPivot.rotation, { x: -0.5, duration: 0.15, yoyo: true, repeat: 1 });
            }
        }

        function toggleMute() {
            const isMuted = window.soundManager.toggleMute();
            document.getElementById('mute-btn').textContent = isMuted ? '🔇' : '🔊';
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
